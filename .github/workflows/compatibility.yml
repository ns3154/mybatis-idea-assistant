name: 定期兼容性验证

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-compatibility:
    name: 验证 ${{ matrix.product_name }} ${{ matrix.ide_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.product }}-${{ matrix.ide_version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: idea
            product_name: IntelliJ IDEA
            ide_version: "2026.1"
          - product: idea
            product_name: IntelliJ IDEA
            ide_version: "2026.2"
          - product: android-studio
            product_name: Android Studio
            ide_version: "2026.1.2.10"

    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 运行兼容性验证
        run: >-
          ./gradlew verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
          -PpluginVerifierProduct=${{ matrix.product }}
          -PpluginVerifierIdeVersion=${{ matrix.ide_version }}

      - name: 上传兼容性验证报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-reports-${{ matrix.product }}-${{ matrix.ide_version }}
          path: |
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: ignore
