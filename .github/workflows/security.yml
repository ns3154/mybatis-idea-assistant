name: 安全扫描

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: 恢复 IntelliJ 布局索引缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle.lockfile') }}

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: 编译生产代码
        # CodeQL 必须观察真实 javac 进程；命中 Gradle 构建缓存会生成空数据库。
        run: ./scripts/run-gradle-with-infrastructure-retry.sh clean compileJava --no-build-cache

      - name: 分析并上传结果
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:java-kotlin
