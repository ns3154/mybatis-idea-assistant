name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-verify:
    name: 构建、测试与兼容验证
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 恢复 IntelliJ 布局索引缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle.lockfile') }}

      - name: 验证 Gradle 基础设施重试边界
        run: ./scripts/test-gradle-infrastructure-retry.sh

      - name: 验证交付 Shell 契约
        run: |
          bash -n scripts/*.sh
          ./scripts/test-sandbox-lifecycle-contract.sh
          ./scripts/test-optional-dependency-isolation-contract.sh
          ./scripts/test-release-input-validation.sh
          ./scripts/test-release-notes.sh
          ./scripts/test-release-required-checks.sh
          ./scripts/test-release-workflow-contract.sh
          ./scripts/test-plugin-archive-identity.sh

      - name: 验证 Java + MyBatis 样例
        run: mvn --batch-mode --file samples/java-mybatis-minimal/pom.xml clean verify

      - name: 验证完整语义语料
        run: mvn --batch-mode --file samples/semantic-corpus/pom.xml clean verify

      - name: 验证 Gradle 多模块 Spring Boot 样例
        run: >-
          ./scripts/run-gradle-with-infrastructure-retry.sh
          -p samples/gradle-spring-boot-multimodule
          clean check :app:bootJar --no-daemon

      - name: 运行测试与插件验证
        run: ./scripts/run-gradle-with-infrastructure-retry.sh check verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: 验证临时测试签名链
        run: ./scripts/verify-ephemeral-plugin-signing.sh

      - name: 验证插件候选身份
        run: >-
          ./scripts/verify-plugin-archive-identity.sh
          build/distributions/mybatis-idea-assistant-0.1.0-SNAPSHOT.zip
          0.1.0-SNAPSHOT

      - name: 上传插件 ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mybatis-idea-assistant
          path: build/distributions/*.zip

      - name: 上传测试与验证报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/reports/checkstyle/
            build/reports/jacoco/
            build/reports/cyclonedx/
            build/reports/pluginVerifier/
            build/reports/problems/
            build/reports/gradle-infrastructure-retry/
            build/reports/ephemeral-signing/
            samples/**/target/surefire-reports/
            samples/**/build/reports/tests/
          if-no-files-found: ignore
