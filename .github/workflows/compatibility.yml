name: 定期兼容性验证

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime-layout-index:
    name: 预热 IntelliJ 布局索引
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 恢复 IntelliJ 布局索引缓存
        id: layout-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle.lockfile') }}

      - name: 验证 Gradle 基础设施重试边界
        run: ./scripts/test-gradle-infrastructure-retry.sh

      - name: 预热最低 SDK 布局索引
        if: ${{ steps.layout-cache.outputs.cache-hit != 'true' }}
        run: ./scripts/run-gradle-with-infrastructure-retry.sh compileJava

      - name: 上传预热失败证据
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layout-index-prime-reports
          path: build/reports/gradle-infrastructure-retry/
          if-no-files-found: ignore

  verify-compatibility:
    name: 验证 ${{ matrix.product_name }} ${{ matrix.ide_version }}
    needs: prime-layout-index
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.product }}-${{ matrix.ide_version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: idea
            product_name: IntelliJ IDEA
            ide_version: "2025.2.6.2"
          - product: idea
            product_name: IntelliJ IDEA
            ide_version: "2025.3.6"
          - product: idea
            product_name: IntelliJ IDEA
            ide_version: "2026.1.4"
          - product: idea
            product_name: IntelliJ IDEA
            ide_version: "2026.2.0.1"
          - product: android-studio
            product_name: Android Studio
            ide_version: "2026.1.2.10"

    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 恢复 IntelliJ 布局索引缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle.lockfile') }}

      - name: 运行兼容性验证
        run: >-
          ./scripts/run-gradle-with-infrastructure-retry.sh
          verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
          -PpluginVerifierProduct=${{ matrix.product }}
          -PpluginVerifierIdeVersion=${{ matrix.ide_version }}

      - name: 上传兼容性验证报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-reports-${{ matrix.product }}-${{ matrix.ide_version }}
          path: |
            build/reports/pluginVerifier/
            build/reports/problems/
            build/reports/gradle-infrastructure-retry/
          if-no-files-found: ignore
