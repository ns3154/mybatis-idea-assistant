name: 三系统无界面回归

on:
  pull_request:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:
    inputs:
      lifecycle_cycles:
        description: 额外执行沙箱 IDE 启停、项目打开关闭和索引重建；0 表示跳过
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  headless-regression:
    name: ${{ matrix.system_name }} 自动化回归
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system_name: Linux
            runner: ubuntu-24.04
          - system_name: macOS
            runner: macos-15
          - system_name: Windows
            runner: windows-2025

    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 恢复 IntelliJ 布局索引缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle.lockfile') }}

      - name: 验证 Gradle 基础设施重试边界
        shell: bash
        run: ./scripts/test-gradle-infrastructure-retry.sh

      - name: 验证 Java 与完整语义语料
        shell: bash
        run: |
          mvn --batch-mode --file samples/java-mybatis-minimal/pom.xml clean verify
          mvn --batch-mode --file samples/semantic-corpus/pom.xml clean verify

      - name: 验证 Gradle 多模块 Spring Boot 样例
        shell: bash
        run: >-
          ./scripts/run-gradle-with-infrastructure-retry.sh
          -p samples/gradle-spring-boot-multimodule
          clean check :app:bootJar --no-daemon

      - name: 运行无界面质量门
        shell: bash
        run: ./scripts/run-gradle-with-infrastructure-retry.sh check verifyPluginProjectConfiguration verifyPluginStructure

      - name: 上传三系统验证报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-reports-${{ matrix.system_name }}
          path: |
            build/reports/tests/
            build/reports/checkstyle/
            build/reports/jacoco/
            build/reports/problems/
            build/reports/gradle-infrastructure-retry/
            samples/**/target/surefire-reports/
            samples/**/build/reports/tests/
          if-no-files-found: ignore

  lifecycle:
    name: IDE 生命周期 ${{ inputs.lifecycle_cycles }} 次
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lifecycle_cycles != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 恢复 IntelliJ 布局索引缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-lifecycle-2026.1.4-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle/lifecycle-2026.1.4.lockfile') }}

      - name: 校验循环次数与虚拟显示器
        env:
          CYCLES: ${{ inputs.lifecycle_cycles }}
        run: |
          if [[ ! "${CYCLES}" =~ ^[1-9][0-9]*$ || "${CYCLES}" -gt 100 ]]; then
            echo "循环次数必须是 1～100 的整数" >&2
            exit 1
          fi
          command -v xvfb-run

      - name: 构建真实语义项目
        run: mvn --batch-mode --file samples/semantic-corpus/pom.xml clean verify

      - name: 运行 IDE 启停、项目打开关闭与索引重建
        env:
          CYCLES: ${{ inputs.lifecycle_cycles }}
          JAVA_TOOL_OPTIONS: -Didea.trust.all.projects=true
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          ./scripts/verify-sandbox-lifecycle.sh
          "${CYCLES}"
          samples/lifecycle-inspection-corpus
          true
          2026.1.4

      - name: 上传生命周期证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ide-lifecycle-${{ inputs.lifecycle_cycles }}
          path: |
            build/reports/lifecycle/
            build/reports/gradle-infrastructure-retry/
          if-no-files-found: error

  optional-dependency-isolation:
    name: 可选依赖隔离 5/5
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lifecycle_cycles != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 恢复 IntelliJ 布局索引缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .intellijPlatform/layoutIndex
          key: intellij-layout-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'gradle.lockfile') }}

      - name: 校验虚拟显示器
        run: command -v xvfb-run

      - name: 禁用可选依赖并验证核心加载
        env:
          JAVA_TOOL_OPTIONS: -Didea.trust.all.projects=true
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          ./scripts/verify-optional-dependency-isolation.sh

      - name: 上传隔离证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optional-dependency-isolation
          path: |
            build/reports/optional-dependency-isolation/
            build/reports/gradle-infrastructure-retry/
          if-no-files-found: error
