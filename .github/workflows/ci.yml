name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-verify:
    name: 构建、测试与兼容验证
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 验证 Java + MyBatis 样例
        run: mvn --batch-mode --file samples/java-mybatis-minimal/pom.xml clean verify

      - name: 运行测试
        run: ./gradlew check

      - name: 构建插件 ZIP
        run: ./gradlew buildPlugin

      - name: 运行 Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: 上传插件 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: mybatis-idea-assistant
          path: build/distributions/*.zip

      - name: 上传测试与验证报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
          if-no-files-found: ignore
