spring:
  application:
    name: gradle-spring-boot-multimodule
  main:
    web-application-type: none
  datasource:
    url: jdbc:h2:mem:gradle_sample;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: io.github.mybatisideaassistant.samples.gradle.domain
  configuration:
    map-underscore-to-camel-case: true
