name: 定期兼容性验证

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-compatibility:
    name: 验证 IntelliJ IDEA ${{ matrix.ide-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.ide-version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        ide-version:
          - "2026.1"
          - "2026.2"

    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 运行兼容性验证
        run: >-
          ./gradlew verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
          -PpluginVerifierIdeVersion=${{ matrix.ide-version }}

      - name: 上传兼容性验证报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-reports-${{ matrix.ide-version }}
          path: |
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: ignore
